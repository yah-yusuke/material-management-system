<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#667eea">
    <title>QRコード在庫管理</title>

    <!-- PWA設定 -->
    <link rel="manifest" href="./manifest.json">
    <link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%23667eea'/%3E%3Ctext x='50' y='70' font-size='60' text-anchor='middle' fill='white'%3E📦%3C/text%3E%3C/svg%3E">

    <!-- QRコードスキャナーライブラリ -->
    <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            line-height: 1.6;
            color: #2d3748;
            padding-bottom: 80px;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
        }

        .header {
            background: linear-gradient(135deg, #ffffff 0%, #f8fafc 100%);
            padding: 25px 20px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            margin-bottom: 20px;
            text-align: center;
        }

        .header h1 {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            font-size: 1.8em;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .header p {
            color: #64748b;
            font-size: 0.9em;
        }

        /* タブナビゲーション */
        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            background: rgba(255,255,255,0.95);
            padding: 10px;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        .tab-btn {
            flex: 1;
            padding: 12px;
            background: transparent;
            border: none;
            border-radius: 10px;
            font-size: 0.9em;
            font-weight: 600;
            color: #64748b;
            cursor: pointer;
            transition: all 0.3s;
        }

        .tab-btn.active {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.3);
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        /* スキャナーセクション */
        .scanner-section {
            background: white;
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            margin-bottom: 20px;
        }

        #reader {
            border-radius: 10px;
            overflow: hidden;
            margin-bottom: 15px;
        }

        .scan-btn {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.3);
        }

        .scan-btn:active {
            transform: scale(0.98);
        }

        .scan-btn.scanning {
            background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%);
        }

        /* フォーム */
        .form-section {
            background: white;
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            font-weight: 600;
            margin-bottom: 5px;
            color: #2d3748;
        }

        .form-group input,
        .form-group textarea {
            width: 100%;
            padding: 12px;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            font-size: 1em;
            transition: all 0.3s;
        }

        .form-group input:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .btn-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .btn {
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-size: 1em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-secondary {
            background: #e2e8f0;
            color: #2d3748;
        }

        /* 在庫リスト */
        .inventory-list {
            background: white;
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }

        .search-box {
            margin-bottom: 15px;
        }

        .search-box input {
            width: 100%;
            padding: 12px;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            font-size: 1em;
        }

        .inventory-item {
            background: #f8fafc;
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 10px;
            border: 2px solid #e2e8f0;
        }

        .item-header {
            display: flex;
            justify-content: space-between;
            align-items: start;
            margin-bottom: 10px;
        }

        .item-name {
            font-weight: 700;
            font-size: 1.1em;
            color: #2d3748;
        }

        .item-code {
            font-size: 0.85em;
            color: #64748b;
            margin-top: 3px;
        }

        .item-quantity {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .quantity-btn {
            width: 35px;
            height: 35px;
            border: none;
            border-radius: 8px;
            font-size: 1.2em;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
        }

        .quantity-btn.minus {
            background: #fee2e2;
            color: #dc2626;
        }

        .quantity-btn.plus {
            background: #dbeafe;
            color: #2563eb;
        }

        .quantity-display {
            font-size: 1.3em;
            font-weight: 700;
            min-width: 60px;
            text-align: center;
            color: #2d3748;
        }

        .item-actions {
            display: flex;
            gap: 5px;
            margin-top: 10px;
        }

        .item-actions button {
            flex: 1;
            padding: 8px;
            border: none;
            border-radius: 6px;
            font-size: 0.85em;
            font-weight: 600;
            cursor: pointer;
        }

        .btn-edit {
            background: #dbeafe;
            color: #2563eb;
        }

        .btn-delete {
            background: #fee2e2;
            color: #dc2626;
        }

        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: #64748b;
        }

        .empty-state-icon {
            font-size: 4em;
            margin-bottom: 15px;
        }

        /* 統計セクション */
        .stats-section {
            background: white;
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }

        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 20px;
        }

        .stat-card {
            background: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%);
            border-radius: 10px;
            padding: 20px;
            text-align: center;
        }

        .stat-value {
            font-size: 2em;
            font-weight: 700;
            color: #667eea;
            margin-bottom: 5px;
        }

        .stat-label {
            font-size: 0.9em;
            color: #64748b;
        }

        .export-btn {
            width: 100%;
            padding: 12px;
            background: #10b981;
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
        }

        /* モーダル */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: white;
            border-radius: 15px;
            padding: 25px;
            max-width: 500px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
        }

        .modal-header {
            font-size: 1.3em;
            font-weight: 700;
            margin-bottom: 20px;
            color: #2d3748;
        }

        .toast {
            position: fixed;
            bottom: 100px;
            left: 50%;
            transform: translateX(-50%);
            background: #2d3748;
            color: white;
            padding: 15px 25px;
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            z-index: 2000;
            display: none;
        }

        .toast.show {
            display: block;
            animation: slideUp 0.3s ease;
        }

        @keyframes slideUp {
            from {
                transform: translateX(-50%) translateY(20px);
                opacity: 0;
            }
            to {
                transform: translateX(-50%) translateY(0);
                opacity: 1;
            }
        }

        /* レスポンシブ */
        @media (max-width: 480px) {
            .container {
                padding: 10px;
            }

            .header h1 {
                font-size: 1.5em;
            }

            .stats-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- ヘッダー -->
        <div class="header">
            <h1>📦 QRコード在庫管理</h1>
            <p>2次元コードで簡単在庫管理</p>
        </div>

        <!-- タブナビゲーション -->
        <div class="tabs">
            <button class="tab-btn active" data-tab="scan">スキャン</button>
            <button class="tab-btn" data-tab="list">在庫一覧</button>
            <button class="tab-btn" data-tab="stats">統計</button>
        </div>

        <!-- スキャンタブ -->
        <div class="tab-content active" id="scan-tab">
            <div class="scanner-section">
                <div id="reader"></div>
                <button class="scan-btn" id="scanBtn">📷 スキャン開始</button>
            </div>

            <div class="form-section" id="itemForm" style="display: none;">
                <h3 style="margin-bottom: 15px; color: #2d3748;">商品情報</h3>
                <div class="form-group">
                    <label>コード</label>
                    <input type="text" id="itemCode" readonly>
                </div>
                <div class="form-group">
                    <label>社内呼び名 <span style="color: #dc2626;">*</span></label>
                    <input type="text" id="itemName" placeholder="例: オフィス用コピー用紙A4">
                </div>
                <div class="form-group">
                    <label>在庫数 <span style="color: #dc2626;">*</span></label>
                    <input type="number" id="itemQuantity" value="1" min="0">
                </div>
                <div class="form-group">
                    <label>備考</label>
                    <textarea id="itemNote" rows="3" placeholder="保管場所や注意事項など"></textarea>
                </div>
                <div class="btn-group">
                    <button class="btn btn-secondary" id="cancelBtn">キャンセル</button>
                    <button class="btn btn-primary" id="saveBtn">保存</button>
                </div>
            </div>
        </div>

        <!-- 在庫一覧タブ -->
        <div class="tab-content" id="list-tab">
            <div class="inventory-list">
                <div class="search-box">
                    <input type="text" id="searchInput" placeholder="🔍 検索（商品名またはコード）">
                </div>
                <div id="inventoryItems"></div>
            </div>
        </div>

        <!-- 統計タブ -->
        <div class="tab-content" id="stats-tab">
            <div class="stats-section">
                <div class="stats-grid">
                    <div class="stat-card">
                        <div class="stat-value" id="totalItems">0</div>
                        <div class="stat-label">商品種類</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-value" id="totalQuantity">0</div>
                        <div class="stat-label">総在庫数</div>
                    </div>
                </div>
                <button class="export-btn" id="exportBtn">📊 CSVエクスポート</button>
            </div>
        </div>
    </div>

    <!-- 編集モーダル -->
    <div class="modal" id="editModal">
        <div class="modal-content">
            <div class="modal-header">商品編集</div>
            <div class="form-group">
                <label>コード</label>
                <input type="text" id="editCode" readonly>
            </div>
            <div class="form-group">
                <label>社内呼び名</label>
                <input type="text" id="editName">
            </div>
            <div class="form-group">
                <label>在庫数</label>
                <input type="number" id="editQuantity" min="0">
            </div>
            <div class="form-group">
                <label>備考</label>
                <textarea id="editNote" rows="3"></textarea>
            </div>
            <div class="btn-group">
                <button class="btn btn-secondary" onclick="closeEditModal()">キャンセル</button>
                <button class="btn btn-primary" onclick="updateItem()">更新</button>
            </div>
        </div>
    </div>

    <!-- トースト通知 -->
    <div class="toast" id="toast"></div>

    <script>
        // データストレージ
        class InventoryStorage {
            constructor() {
                this.key = 'qr_inventory_data';
            }

            getAll() {
                const data = localStorage.getItem(this.key);
                return data ? JSON.parse(data) : [];
            }

            save(items) {
                localStorage.setItem(this.key, JSON.stringify(items));
            }

            add(item) {
                const items = this.getAll();
                items.push(item);
                this.save(items);
            }

            update(code, updatedItem) {
                const items = this.getAll();
                const index = items.findIndex(item => item.code === code);
                if (index !== -1) {
                    items[index] = { ...items[index], ...updatedItem };
                    this.save(items);
                    return true;
                }
                return false;
            }

            delete(code) {
                const items = this.getAll();
                const filtered = items.filter(item => item.code !== code);
                this.save(filtered);
            }

            find(code) {
                const items = this.getAll();
                return items.find(item => item.code === code);
            }
        }

        const storage = new InventoryStorage();
        let html5QrCode = null;
        let isScanning = false;
        let currentEditCode = null;

        // タブ切り替え
        document.querySelectorAll('.tab-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                const tab = btn.dataset.tab;

                // タブボタンのアクティブ状態
                document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');

                // タブコンテンツの表示切り替え
                document.querySelectorAll('.tab-content').forEach(content => {
                    content.classList.remove('active');
                });
                document.getElementById(`${tab}-tab`).classList.add('active');

                // スキャンタブから離れる時はスキャンを停止
                if (tab !== 'scan' && isScanning) {
                    stopScanning();
                }

                // 在庫一覧タブに切り替えたら更新
                if (tab === 'list') {
                    renderInventoryList();
                }

                // 統計タブに切り替えたら更新
                if (tab === 'stats') {
                    updateStats();
                }
            });
        });

        // スキャン開始/停止
        document.getElementById('scanBtn').addEventListener('click', () => {
            if (isScanning) {
                stopScanning();
            } else {
                startScanning();
            }
        });

        function startScanning() {
            const scanBtn = document.getElementById('scanBtn');
            scanBtn.textContent = '⏹ スキャン停止';
            scanBtn.classList.add('scanning');

            if (!html5QrCode) {
                html5QrCode = new Html5Qrcode("reader");
            }

            const config = {
                fps: 10,
                qrbox: { width: 250, height: 250 },
                aspectRatio: 1.0
            };

            html5QrCode.start(
                { facingMode: "environment" },
                config,
                onScanSuccess,
                onScanError
            ).then(() => {
                isScanning = true;
            }).catch(err => {
                showToast('カメラの起動に失敗しました');
                console.error(err);
                stopScanning();
            });
        }

        function stopScanning() {
            const scanBtn = document.getElementById('scanBtn');
            scanBtn.textContent = '📷 スキャン開始';
            scanBtn.classList.remove('scanning');

            if (html5QrCode && isScanning) {
                html5QrCode.stop().then(() => {
                    isScanning = false;
                }).catch(err => {
                    console.error(err);
                    isScanning = false;
                });
            }
        }

        function onScanSuccess(decodedText, decodedResult) {
            stopScanning();
            showItemForm(decodedText);
            showToast('コードを読み取りました');
        }

        function onScanError(errorMessage) {
            // スキャンエラーは頻繁に発生するので無視
        }

        // 商品フォーム表示
        function showItemForm(code) {
            const existingItem = storage.find(code);

            document.getElementById('itemCode').value = code;

            if (existingItem) {
                document.getElementById('itemName').value = existingItem.name;
                document.getElementById('itemQuantity').value = existingItem.quantity;
                document.getElementById('itemNote').value = existingItem.note || '';
            } else {
                document.getElementById('itemName').value = '';
                document.getElementById('itemQuantity').value = '1';
                document.getElementById('itemNote').value = '';
            }

            document.getElementById('itemForm').style.display = 'block';
        }

        // 保存ボタン
        document.getElementById('saveBtn').addEventListener('click', () => {
            const code = document.getElementById('itemCode').value;
            const name = document.getElementById('itemName').value.trim();
            const quantity = parseInt(document.getElementById('itemQuantity').value) || 0;
            const note = document.getElementById('itemNote').value.trim();

            if (!name) {
                showToast('社内呼び名を入力してください');
                return;
            }

            const existingItem = storage.find(code);

            if (existingItem) {
                storage.update(code, {
                    name,
                    quantity,
                    note,
                    updatedAt: new Date().toISOString()
                });
                showToast('商品情報を更新しました');
            } else {
                storage.add({
                    code,
                    name,
                    quantity,
                    note,
                    createdAt: new Date().toISOString(),
                    updatedAt: new Date().toISOString()
                });
                showToast('新しい商品を登録しました');
            }

            hideItemForm();
        });

        // キャンセルボタン
        document.getElementById('cancelBtn').addEventListener('click', hideItemForm);

        function hideItemForm() {
            document.getElementById('itemForm').style.display = 'none';
            document.getElementById('itemCode').value = '';
            document.getElementById('itemName').value = '';
            document.getElementById('itemQuantity').value = '1';
            document.getElementById('itemNote').value = '';
        }

        // 在庫一覧表示
        function renderInventoryList(filter = '') {
            const items = storage.getAll();
            const container = document.getElementById('inventoryItems');

            const filteredItems = items.filter(item =>
                item.name.toLowerCase().includes(filter.toLowerCase()) ||
                item.code.toLowerCase().includes(filter.toLowerCase())
            );

            if (filteredItems.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">📦</div>
                        <p>在庫データがありません</p>
                        <p style="font-size: 0.9em; margin-top: 10px;">スキャンタブからQRコードを読み取って登録してください</p>
                    </div>
                `;
                return;
            }

            container.innerHTML = filteredItems.map(item => `
                <div class="inventory-item">
                    <div class="item-header">
                        <div>
                            <div class="item-name">${escapeHtml(item.name)}</div>
                            <div class="item-code">${escapeHtml(item.code)}</div>
                        </div>
                        <div class="item-quantity">
                            <button class="quantity-btn minus" onclick="updateQuantity('${escapeHtml(item.code)}', -1)">−</button>
                            <span class="quantity-display">${item.quantity}</span>
                            <button class="quantity-btn plus" onclick="updateQuantity('${escapeHtml(item.code)}', 1)">+</button>
                        </div>
                    </div>
                    ${item.note ? `<div style="font-size: 0.9em; color: #64748b; margin-top: 8px;">📝 ${escapeHtml(item.note)}</div>` : ''}
                    <div class="item-actions">
                        <button class="btn-edit" onclick="openEditModal('${escapeHtml(item.code)}')">✏️ 編集</button>
                        <button class="btn-delete" onclick="deleteItem('${escapeHtml(item.code)}')">🗑️ 削除</button>
                    </div>
                </div>
            `).join('');
        }

        // 検索
        document.getElementById('searchInput').addEventListener('input', (e) => {
            renderInventoryList(e.target.value);
        });

        // 在庫数の増減
        function updateQuantity(code, delta) {
            const item = storage.find(code);
            if (item) {
                const newQuantity = Math.max(0, item.quantity + delta);
                storage.update(code, {
                    quantity: newQuantity,
                    updatedAt: new Date().toISOString()
                });
                renderInventoryList(document.getElementById('searchInput').value);
                updateStats();
            }
        }

        // 編集モーダル
        function openEditModal(code) {
            const item = storage.find(code);
            if (!item) return;

            currentEditCode = code;
            document.getElementById('editCode').value = item.code;
            document.getElementById('editName').value = item.name;
            document.getElementById('editQuantity').value = item.quantity;
            document.getElementById('editNote').value = item.note || '';
            document.getElementById('editModal').classList.add('active');
        }

        function closeEditModal() {
            document.getElementById('editModal').classList.remove('active');
            currentEditCode = null;
        }

        function updateItem() {
            if (!currentEditCode) return;

            const name = document.getElementById('editName').value.trim();
            const quantity = parseInt(document.getElementById('editQuantity').value) || 0;
            const note = document.getElementById('editNote').value.trim();

            if (!name) {
                showToast('社内呼び名を入力してください');
                return;
            }

            storage.update(currentEditCode, {
                name,
                quantity,
                note,
                updatedAt: new Date().toISOString()
            });

            closeEditModal();
            renderInventoryList(document.getElementById('searchInput').value);
            updateStats();
            showToast('商品情報を更新しました');
        }

        // モーダル外クリックで閉じる
        document.getElementById('editModal').addEventListener('click', (e) => {
            if (e.target.id === 'editModal') {
                closeEditModal();
            }
        });

        // 削除
        function deleteItem(code) {
            if (confirm('この商品を削除してもよろしいですか?')) {
                storage.delete(code);
                renderInventoryList(document.getElementById('searchInput').value);
                updateStats();
                showToast('商品を削除しました');
            }
        }

        // 統計更新
        function updateStats() {
            const items = storage.getAll();
            const totalItems = items.length;
            const totalQuantity = items.reduce((sum, item) => sum + item.quantity, 0);

            document.getElementById('totalItems').textContent = totalItems;
            document.getElementById('totalQuantity').textContent = totalQuantity;
        }

        // CSVエクスポート
        document.getElementById('exportBtn').addEventListener('click', () => {
            const items = storage.getAll();

            if (items.length === 0) {
                showToast('エクスポートするデータがありません');
                return;
            }

            let csv = '\uFEFF'; // BOM for Excel
            csv += 'コード,社内呼び名,在庫数,備考,登録日時,更新日時\n';

            items.forEach(item => {
                csv += `"${item.code}","${item.name}",${item.quantity},"${item.note || '"}","${item.createdAt}","${item.updatedAt}"\n`;
            });

            const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement('a');
            const url = URL.createObjectURL(blob);

            link.setAttribute('href', url);
            link.setAttribute('download', `在庫データ_${new Date().toISOString().split('T')[0]}.csv`);
            link.style.visibility = 'hidden';

            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);

            showToast('CSVファイルをダウンロードしました');
        });

        // トースト通知
        function showToast(message) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.classList.add('show');

            setTimeout(() => {
                toast.classList.remove('show');
            }, 3000);
        }

        // XSS対策
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // 初期化
        renderInventoryList();
        updateStats();

        // サービスワーカーの登録（PWA対応）
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./service-worker.js')
                    .then(registration => {
                        console.log('ServiceWorker registered:', registration);
                    })
                    .catch(err => {
                        console.log('ServiceWorker registration failed:', err);
                    });
            });
        }
    </script>
</body>
</html>
